name: EAS Build & Update

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: "eas.json build profile to use (for a manual full build)"
        required: true
        default: "preview"
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  update:
    name: Publish EAS Update (JS-only, on every push to main)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update to "preview" branch
        # This is the JS-only push testers pick up on next app open — no
        # native rebuild, no new APK, no resend. Only covers changes that
        # don't touch native code/config (see note below).
        run: eas update --branch preview --message "${{ github.event.head_commit.message }}" --non-interactive

  build:
    name: Full native build (manual only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build on EAS (Android)
        run: eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive